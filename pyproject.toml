[build-system]
requires = ["setuptools>=82.0.0", "wheel>=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tabnetics"
version = "0.1.0"
description = "HDLSS-focused tabular learning toolkit with distribution-aware preprocessing, portfolio feature selection, and game-theoretic method aggregation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Marko Kokol", email = "marko@kokol.dev" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["feature-selection", "hdlss", "tabular", "bioinformatics", "distribution-fitting", "mnpo"]

dependencies = [
  "numpy>=2.4.2",
  "pandas>=3.0.1",
  "scipy>=1.17.1",
  "scikit-learn>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/klokedm/tabnetics-public"
Repository = "https://github.com/klokedm/tabnetics-public"
Documentation = "https://github.com/klokedm/tabnetics-public/blob/main/USING.md"

[project.optional-dependencies]
benchmarks = [
  "boruta>=0.4.3",
  "catboost>=1.2.10",
  "datasets>=4.6.1",
  "flaml>=2.5.0",
  "lightgbm>=4.6.0",
  "mapie>=1.3.0",
  "matplotlib>=3.10.8",
  "pyvinecopulib>=0.7.5",
  "tabpfn>=6.4.1",
  "torch>=2.10.0",
  "tqdm>=4.67.3",
  "xgboost>=3.2.0",
]
feature-selection-optional = [
  "boruta>=0.4.3",
  "mapie>=1.3.0",
  "matplotlib>=3.10.8",
  "pyvinecopulib>=0.7.5",
  "tqdm>=4.67.3",
]
validation = [
  "datasets>=4.6.1",
]
multiomics = []

experimental = [
  "botorch>=0.17.2",
  "causal-conv1d>=1.6.0",
  "copulas>=0.14.1",
  "einops>=0.8.2",
  "gpytorch>=1.15.2",
  "huggingface_hub>=1.6.0",
  "mamba-ssm>=2.3.0",
  "pyarrow>=23.0.1",
  "seaborn>=0.13.2",
  "torchscale>=0.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tabnetics*"]
